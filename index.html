<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 축제 안내</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      background: #f4f4f8;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* 헤더 */
    .card-header {
      padding: 20px 24px;
      background: #9234ff;
      color: #fdfff6;
    }
    .card-header h1 { margin: 0; font-size: 1.5rem; }
    .card-header p { margin: 4px 0 0; font-size: 0.9rem; opacity: 0.85; }

    /* 네비게이션 메뉴 */
    nav {
      display: flex;
      border-bottom: 1px solid #eee;
    }
    nav a {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      color: #555;
      text-decoration: none;
      font-size: 0.95rem;
    }
    nav a:hover { background: #f4eaff; }
    nav a.active {
      color: #9234ff;
      font-weight: bold;
      border-bottom: 3px solid #9234ff;
    }

    /* 바디 */
    main { padding: 24px; text-align: center; }
    main h2 { margin: 0 0 12px; font-size: 1.1rem; }
    ul.taste {
      list-style: none;
      padding: 0;
      margin: 0 0 20px;
      text-align: left;
    }
    ul.taste li { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }

    /* 푸터 */
    footer {
      padding: 14px 24px;
      text-align: center;
      font-size: 0.85rem;
      color: #777;
      background: #fafafa;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="card">
    <header class="card-header">
      <h1>🍊 제주 축제 안내</h1>
      <p>제주 축제 안내 에이전트</p>
    </header>

    <nav>
      <a href="#" class="active">메인</a>
      <a href="#">축제</a>
      <a href="#">정보</a>
    </nav>

    <main>
      <h2>제주 축제 안내</h2>
      <ul class="taste">
        <li>🏙️ 제주시에서 열리는 축제</li>
        <li>👥 사람이 많이 오는 축제</li>
        <li>🌋 제주만의 특성이 담긴 축제</li>
      </ul>
    </main>

    <footer>© 2026 Jihyunkoh</footer>
  </div>
</body>
</html>
