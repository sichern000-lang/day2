<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 축제 안내</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f4f8;
      color: #222;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-areas:
        "header  header"
        "nav     nav"
        "section aside"
        "article aside"
        "footer  footer";
      gap: 12px;
    }
    .page > * {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px 20px;
    }
    h1, h2, h3 { margin: 0 0 8px; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; }
    h3 { font-size: 1rem; }
    p { margin: 0 0 8px; }
    ul { margin: 0; padding-left: 20px; }
    li { padding: 3px 0; }

    .page > header { grid-area: header; background: #9234ff; color: #fdfff6; border: none; }
    header p { margin: 0; opacity: 0.85; font-size: 0.9rem; }

    nav { grid-area: nav; display: flex; gap: 8px; padding: 8px; }
    nav a {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      color: #555;
      text-decoration: none;
      border-radius: 8px;
    }
    nav a:hover { background: #f4eaff; }
    nav a.active { color: #9234ff; font-weight: bold; background: #f4eaff; }

    section { grid-area: section; }
    article { grid-area: article; }
    .page > aside { grid-area: aside; background: #faf5ff; }

    .page > footer { grid-area: footer; text-align: center; font-size: 0.85rem; color: #777; background: #fafafa; }

    @media (max-width: 520px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-areas: "header" "nav" "section" "article" "aside" "footer";
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>🍊 제주 축제 안내</h1>
      <p>2026년 하반기 제주도 축제를 알려드립니다</p>
    </header>

    <nav>
      <a href="#" class="active">메인</a>
      <a href="#">축제</a>
      <a href="#">정보</a>
    </nav>

    <section>
      <h2>💬 이런 걸 물어보세요</h2>
      <ul>
        <li>🏙️ 제주시에서 열리는 축제</li>
        <li>👥 사람이 많이 오는 축제</li>
        <li>🌋 제주만의 특성이 담긴 축제</li>
      </ul>
    </section>

    <article>
      <h2>🎪 축제 한눈에 보기</h2>
      <p>계절별 날짜 순서로 축제 일정과 행사, 체험 장소를 정리해 드립니다.</p>
      <ul>
        <li>📅 계절·날짜별 행사</li>
        <li>🎨 체험 프로그램과 장소</li>
      </ul>
    </article>

    <aside>
      <h3>📊 함께 보면 좋은 정보</h3>
      <ul>
        <li>👥 작년 방문객 수</li>
        <li>🌤️ 작년 날씨</li>
        <li>🌦️ 올해 축제일 날씨</li>
      </ul>
    </aside>

    <footer>© 2026 Jihyunkoh</footer>
  </div>
</body>
</html>
