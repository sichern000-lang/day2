<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixabay 이미지 슬라이드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f4f8;
      color: #222;
    }
    .box { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #9234ff;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #7a1fe0; }
    button:disabled { background: #bbb; cursor: default; }
    #msg { min-height: 1.4em; color: #c0392b; font-size: 0.9rem; }

    .slider {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: none;
    }
    .slider img { width: 100%; height: 100%; object-fit: contain; }
    .slider .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 14px;
    }
    #prev { left: 8px; }
    #next { right: 8px; }
    .info { display: none; margin-top: 8px; text-align: center; font-size: 0.9rem; }
    .info .row { justify-content: center; margin-top: 8px; }
    .credit { margin-top: 16px; font-size: 0.8rem; color: #777; text-align: center; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🖼️ Pixabay 이미지 슬라이드</h1>

    <div class="row">
      <input id="key" type="password" placeholder="Pixabay API 키" autocomplete="off">
    </div>
    <div class="row">
      <input id="query" type="text" placeholder="검색어 (예: 제주, jeju, tangerine)">
      <button id="search">검색</button>
    </div>
    <div id="msg"></div>

    <div class="slider" id="slider">
      <img id="photo" alt="">
      <button class="nav" id="prev" aria-label="이전">◀</button>
      <button class="nav" id="next" aria-label="다음">▶</button>
    </div>

    <div class="info" id="info">
      <div id="counter"></div>
      <div class="row">
        <button id="prevPage">◀ 이전 10개</button>
        <button id="nextPage">다음 10개 ▶</button>
      </div>
    </div>

    <p class="credit">Images from <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a></p>
  </div>

  <script>
    const PER_PAGE = 10;
    const $ = (id) => document.getElementById(id);

    let hits = [];
    let index = 0;
    let page = 1;
    let totalPages = 1;
    let lastQuery = '';

    // 키는 코드에 적지 않고 입력창으로만 받습니다 (이 브라우저의 sessionStorage에만 보관)
    try { $('key').value = sessionStorage.getItem('pixabayKey') || ''; } catch (e) {}

    async function load(q, p) {
      const key = $('key').value.trim();
      if (!key) { $('msg').textContent = 'API 키를 입력하세요.'; return; }
      if (!q) { $('msg').textContent = '검색어를 입력하세요.'; return; }
      try { sessionStorage.setItem('pixabayKey', key); } catch (e) {}

      $('msg').textContent = '불러오는 중...';
      const url = 'https://pixabay.com/api/?' + new URLSearchParams({
        key, q, page: p, per_page: PER_PAGE, image_type: 'photo', safesearch: 'true'
      });
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status === 400 ? 'API 키가 올바르지 않습니다.' : '요청 실패 (' + res.status + ')');
        const data = await res.json();
        if (!data.hits.length) { $('msg').textContent = '검색 결과가 없습니다.'; return; }

        hits = data.hits;
        index = 0;
        page = p;
        lastQuery = q;
        totalPages = Math.max(1, Math.ceil(Math.min(data.totalHits, 500) / PER_PAGE));
        $('msg').textContent = '';
        render();
      } catch (err) {
        $('msg').textContent = err.message;
      }
    }

    function render() {
      const h = hits[index];
      $('photo').src = h.webformatURL;
      $('photo').alt = h.tags;
      $('slider').style.display = 'block';
      $('info').style.display = 'block';
      $('counter').textContent =
        `${index + 1} / ${hits.length}  ·  페이지 ${page} / ${totalPages}  ·  ${h.tags}`;
      $('prevPage').disabled = page <= 1;
      $('nextPage').disabled = page >= totalPages;
    }

    $('search').addEventListener('click', () => load($('query').value.trim(), 1));
    $('query').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('search').click(); });
    $('prev').addEventListener('click', () => { index = (index - 1 + hits.length) % hits.length; render(); });
    $('next').addEventListener('click', () => { index = (index + 1) % hits.length; render(); });
    $('prevPage').addEventListener('click', () => load(lastQuery, page - 1));
    $('nextPage').addEventListener('click', () => load(lastQuery, page + 1));
  </script>
</body>
</html>
